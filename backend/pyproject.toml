[project]
name = "micro-credit-precheck-backend"
version = "0.1.0"
description = "F2 小微企业授信智能预审系统后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pymysql",
    "python-dotenv",
    "torch>=2.6",
    "sentence-transformers>=6.2.0",
    "huggingface-hub>=2.3.0",
    "sentencepiece>=0.2.2",
    "chromadb>=1.5.9",
    "httpx>=0.28,<0.29",
    "pypdf>=6,<7",
]

[tool.uv]
package = false
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
